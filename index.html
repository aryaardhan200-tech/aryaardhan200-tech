<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Animasi Bintang & Mawar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #stars {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Gambar Bunga Mawar di Tengah */
        .center-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Angka tinggi agar berada DI ATAS canvas bintang */
            width: 280px; 
            max-width: 80vw;
            pointer-events: none;
            /* Efek Kilau/Glow Pink-Emas seperti di video */
            filter: drop-shadow(0 0 25px rgba(255, 192, 203, 0.9)) drop-shadow(0 0 45px rgba(255, 215, 0, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-12px); }
            100% { transform: translate(-50%, -50%) translateY(0px); }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    
    <!-- Link gambar bunga mawar kristal transparan yang dijamin aman dan pasti muncul -->
    <img id="rose" src="https://images.rawpixel.com/image_png_800/png/cGZzLTEwL2ltYWdlcy9yYXdwaXhlbF9yZWxlYXNlZC9zdGF0aWMvaW1hZ2Uva2lkODJna3FfcmF3cGl4ZWxfOTgwMjgucG5n.png" class="center-image" alt="Rose">

    <script>
        var context;
        var arr = new Array();
        var starCount = 800;
        var rains = new Array();
        var rainCount = 30;

        function init() {
            var stars = document.getElementById("stars");
            stars.width = window.innerWidth;
            stars.height = window.innerHeight;
            context = stars.getContext("2d");
        }

        var Star = function() {
            this.x = window.innerWidth * Math.random();
            this.y = window.innerHeight * Math.random();
            this.text = ".";
            this.color = "white";
            
            this.getColor = function() {
                this.color = Math.random() < 0.5 ? "#333" : "white";
            };
            
            this.init = function() {
                this.getColor();
            };
            
            this.draw = function() {
                context.fillStyle = this.color;
                context.font = "15px Arial";
                context.fillText(this.text, this.x, this.y);
            };
        };

        var MeteorRain = function() {
            this.x = -1;
            this.y = -1;
            this.length = -1;
            this.angle = 30; 
            this.width = -1;
            this.height = -1;
            this.speed = 1;
            this.offset_x = -1;
            this.offset_y = -1;
            this.alpha = 1;
            
            this.init = function() {
                this.getPos();
                this.alpha = 1;
                this.length = Math.ceil(Math.random() * 80 + 150);
                this.angle = 30; 
                this.speed = Math.ceil(Math.random() * 5 + 5);
                
                var cos = Math.cos(this.angle * 3.14 / 180);
                var sin = Math.sin(this.angle * 3.14 / 180);
                this.width = this.length * cos;
                this.height = this.length * sin;
                this.offset_x = this.speed * cos;
                this.offset_y = this.speed * sin;
            };
            
            this.getPos = function() {
                this.x = Math.random() * window.innerWidth + 300; 
                this.y = Math.random() * window.innerHeight * -1;
            };
            
            this.draw = function() {
                context.save();
                context.beginPath();
                context.lineWidth = 2;
                context.globalAlpha = this.alpha;
                
                var line = context.createLinearGradient(this.x, this.y, this.x + this.width, this.y - this.height);
                line.addColorStop(0, "white");
                line.addColorStop(0.4, "rgba(255,255,255,0.5)");
                line.addColorStop(1, "transparent");
                
                context.strokeStyle = line;
                context.moveTo(this.x, this.y);
                context.lineTo(this.x + this.width, this.y - this.height);
                context.closePath();
                context.stroke();
                context.restore();
            };
            
            this.move = function() {
                this.x -= this.offset_x;
                this.y += this.offset_y;
                this.alpha -= 0.003;
                this.draw();
            };
        };

        function playStars() {
            for (var n = 0; n < starCount; n++) {
                arr[n].getColor();
                arr[n].draw();
            }
        }

        function playRains() {
            for (var n = 0; n < rainCount; n++) {
                var rain = rains[n];
                rain.move();
                if (rain.y > window.innerHeight + 100 || rain.alpha <= 0 || rain.x < -100) {
                    rains[n] = new MeteorRain();
                    rains[n].init();
                }
            }
        }

        window.onload = function() {
            init();
            for (var i = 0; i < starCount; i++) {
                var star = new Star();
                star.init();
                star.draw();
                arr.push(star);
            }
            for (var i = 0; i < rainCount; i++) {
                var rain = new MeteorRain();
                rain.init();
                rain.draw();
                rains.push(rain);
            }
            setInterval(function() {
                context.clearRect(0, 0, window.innerWidth, window.innerHeight);
                playStars();
                playRains();
            }, 1000 / 60); 
        };
        
        window.onresize = function() {
            init();
        };
    </script>
</body>
</html>
