<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Star and Meteor Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }
        #stars {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Gambar di tengah */
        .center-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 350px; /* Atur ukuran gambar di sini */
            pointer-events: none;
            /* Efek cahaya glow (merah muda) */
            filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.9));
            /* Tambahan animasi mengambang agar lebih estetik */
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { top: 50%; }
            50% { top: 48%; }
            100% { top: 50%; }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    
    <!-- Gambar bunga mawar online, akan langsung muncul tanpa perlu download file lokal -->
    <img src="https://png.pngtree.com/png-clipart/20230102/ourmid/pngtree-pink-crystal-rose-png-image_6549216.png" class="center-image" alt="center image">

    <script>
        var context;
        var arr = new Array();
        var starCount = 800; // Jumlah bintang
        var rains = new Array();
        var rainCount = 40; // Jumlah meteor diperbanyak agar lebih sering terlihat

        function init() {
            var stars = document.getElementById("stars");
            stars.width = window.innerWidth;
            stars.height = window.innerHeight;
            context = stars.getContext("2d");
        }

        // --- Bintang ---
        var Star = function() {
            this.x = window.innerWidth * Math.random();
            this.y = window.innerHeight * Math.random();
            this.text = ".";
            this.color = "white";
            
            this.getColor = function() {
                var _r = Math.random();
                if (_r < 0.5) {
                    this.color = "#333";
                } else {
                    this.color = "white";
                }
            };
            
            this.init = function() {
                this.getColor();
            };
            
            this.draw = function() {
                context.fillStyle = this.color;
                context.font = "15px Arial";
                context.fillText(this.text, this.x, this.y);
            };
        };

        // --- Hujan Meteor ---
        var MeteorRain = function() {
            this.x = -1;
            this.y = -1;
            this.length = -1;
            this.angle = 30; 
            this.width = -1;
            this.height = -1;
            this.speed = 1;
            this.offset_x = -1;
            this.offset_y = -1;
            this.alpha = 1;
            this.color1 = "";
            this.color2 = "";
            
            this.init = function() {
                this.getPos();
                this.alpha = 1;
                this.getRandomColor();
                var x = Math.random() * 80 + 150;
                this.length = Math.ceil(x);
                this.angle = 30; 
                x = Math.random() * 5 + 5; // Kecepatan meteor sedikit dipercepat
                this.speed = Math.ceil(x);
                
                var cos = Math.cos(this.angle * 3.14 / 180);
                var sin = Math.sin(this.angle * 3.14 / 180);
                this.width = this.length * cos;
                this.height = this.length * sin;
                this.offset_x = this.speed * cos;
                this.offset_y = this.speed * sin;
            };
            
            this.getRandomColor = function() {
                var a = Math.ceil(255 - 240 * Math.random());
                this.color1 = "rgba(" + a + "," + a + "," + a + ",1)";
                this.color2 = "black";
            };
            
            this.getPos = function() {
                // Agar meteor muncul dari sisi kanan atas
                this.x = Math.random() * window.innerWidth + 200; 
                this.y = Math.random() * window.innerHeight * -1; // Muncul perlahan dari luar layar atas
            };
            
            this.draw = function() {
                context.save();
                context.beginPath();
                context.lineWidth = 2; // Garis meteor sedikit dipertebal
                context.globalAlpha = this.alpha;
                
                var line = context.createLinearGradient(this.x, this.y, this.x + this.width, this.y - this.height);
                line.addColorStop(0, "white");
                line.addColorStop(0.3, this.color1);
                line.addColorStop(0.6, this.color2);
                
                context.strokeStyle = line;
                context.moveTo(this.x, this.y);
                context.lineTo(this.x + this.width, this.y - this.height);
                context.closePath();
                context.stroke();
                context.restore();
            };
            
            this.move = function() {
                this.x = this.x - this.offset_x;
                this.y = this.y + this.offset_y;
                this.alpha -= 0.002;
                this.draw();
            };
        };

        function playStars() {
            for (var n = 0; n < starCount; n++) {
                arr[n].getColor();
                arr[n].draw();
            }
        }

        function playRains() {
            for (var n = 0; n < rainCount; n++) {
                var rain = rains[n];
                rain.move();
                if (rain.y > window.innerHeight + 100 || rain.alpha <= 0 || rain.x < -100) {
                    rains[n] = new MeteorRain();
                    rains[n].init();
                }
            }
        }

        window.onload = function() {
            init();
            for (var i = 0; i < starCount; i++) {
                var star = new Star();
                star.init();
                star.draw();
                arr.push(star);
            }
            for (var i = 0; i < rainCount; i++) {
                var rain = new MeteorRain();
                rain.init();
                rain.draw();
                rains.push(rain);
            }
            setInterval(function() {
                context.clearRect(0, 0, window.innerWidth, window.innerHeight);
                playStars();
                playRains();
            }, 1000 / 60); 
        };
        
        window.onresize = function() {
            var stars = document.getElementById("stars");
            stars.width = window.innerWidth;
            stars.height = window.innerHeight;
        };
    </script>
</body>
</html>
