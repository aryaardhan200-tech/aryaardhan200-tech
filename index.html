<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose & Stars Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Styling untuk teks/gambar mawar di tengah */
        .rose-container {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .rose-text {
            color: #ffb6c1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { opacity: 0.6; text-shadow: 0 0 5px #ff69b4; }
            to { opacity: 1; text-shadow: 0 0 20px #ff1493, 0 0 30px #ff69b4; }
        }
    </style>
</head>
<body>

    <!-- Kanvas untuk efek bintang/hujan -->
    <canvas id="canvas"></canvas>

    <!-- Elemen visual mawar di tengah -->
    <div class="rose-container">
        <div class="rose-text">🌹 For You 🌹</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Membuat partikel bintang / hujan
        const particles = [];
        const maxParticles = 100;

        for (let i = 0; i < maxParticles; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2,
                speedY: Math.random() * 1 + 0.5,
                alpha: Math.random()
            });
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.fillStyle = 'white';
            particles.forEach(p => {
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y += p.speedY;
                if (p.y > height) {
                    p.y = 0;
                    p.x = Math.random() * width;
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
